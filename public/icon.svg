<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#igGrad)" />
  <!-- Crisp white camera body -->
  <rect x="5.5" y="5.5" width="21" height="21" rx="6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Center lens -->
  <circle cx="16" cy="16" r="4.5" fill="none" stroke="#ffffff" stroke-width="2.2" />
  <!-- Flash dot -->
  <circle cx="21.5" cy="10.5" r="1.2" fill="#ffffff" />
</svg>
