<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #09090b;
      color: #fafafa;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .gradient-text {
      font-weight: 800;
      font-size: 16px;
      background: linear-gradient(to right, #ec4899, #f43f5e, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.4;
      margin: 0 0 12px 0;
    }

    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover {
      background: #3f3f46;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #34d399;
      margin-bottom: 12px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
    }
  </style>
</head>

<body>
  <div class="header">
    <span class="gradient-text">InstaView Downloader</span>
  </div>
  <div class="status-badge">
    <span class="dot"></span>
    <span>Active on Instagram.com</span>
  </div>
  <p>
    Browse Instagram as usual. Download buttons will automatically appear under posts, reels, and stories (even for
    private accounts you follow).
  </p>
  <a href="https://ig-storyviewer.vercel.app" target="_blank" class="btn">
    Open Anonymous Web Viewer ↗
  </a>
</body>

</html>
